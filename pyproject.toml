[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "swingbus"
dynamic = ["version"]
description = "Power flow, N-1 screening, DC optimal power flow and cascade simulation for transmission grids, in NumPy and SciPy."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/swingbus/cases/NOTICE.md"]
authors = [{ name = "Elmehdi Essamit" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.12"]
keywords = [
  "power systems",
  "power flow",
  "load flow",
  "newton-raphson",
  "optimal power flow",
  "contingency analysis",
  "cascading failures",
  "matpower",
  "pglib-opf",
  "electrical engineering",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Typing :: Typed",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
test = ["pytest>=8", "pytest-cov>=5", "PYPOWER>=5.1.16"]
dev = ["swingbus[plot,test]", "ruff>=0.15", "mypy>=1.13", "pre-commit>=4", "build>=1.2", "twine>=6"]

[project.scripts]
swingbus = "swingbus.cli:main"

[project.urls]
Homepage = "https://github.com/akeanti/swingbus"
Documentation = "https://github.com/akeanti/swingbus/tree/main/docs"
Issues = "https://github.com/akeanti/swingbus/issues"
Changelog = "https://github.com/akeanti/swingbus/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/swingbus/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
  "src",
  "tests",
  "docs",
  "examples",
  "README.md",
  "CHANGELOG.md",
  "CITATION.cff",
  "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
  "oracle: cross-checks against PYPOWER",
  "network: needs internet access",
  "slow: takes more than a few seconds",
]
filterwarnings = ["error", "ignore::DeprecationWarning:pypower", "ignore::SyntaxWarning"]

[tool.coverage.run]
source = ["swingbus"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "NPY", "PERF", "PT", "RUF", "ERA"]
ignore = ["E741", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"src/swingbus/_pglib.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["swingbus"]

[tool.mypy]
python_version = "3.10"
files = ["src/swingbus"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*", "matplotlib", "matplotlib.*"]
ignore_missing_imports = true
